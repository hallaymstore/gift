name: CI
on:
  push:
  pull_request:
jobs:
  factory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bots/factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
