name: Cloner channel and group routing
on:
  pull_request:
    paths:
      - 'bots/factory/channel-clone-peers.js'
      - 'bots/factory/channel-clone-peers.test.js'
      - 'bots/factory/channel-clone-bot.js'
      - 'bots/factory/channel-clone-count.js'
      - 'bots/factory/public-channel-watcher.js'
      - 'bots/factory/server.js'
      - 'bots/factory/package.json'
      - '.github/workflows/cloner-group-routing-check.yml'
  workflow_dispatch:

jobs:
  syntax-and-peer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax for all affected code
        run: |
          node --check bots/factory/channel-clone-bot.js
          node --check bots/factory/channel-clone-peers.js
          node --check bots/factory/channel-clone-count.js
          node --check bots/factory/public-channel-watcher.js
          node --check bots/factory/server.js
      - name: Public and private group peer tests
        run: node --test bots/factory/channel-clone-peers.test.js
      - name: Existing public channel watcher regressions
        run: node --test bots/factory/public-channel-watcher.test.js
