<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Garant Market Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function(){
      const firstPath = location.pathname.split('/').filter(Boolean)[0] || '';
      window.APP_BASE_PATH = firstPath ? '/' + firstPath : '';
      const nativeFetch = window.fetch.bind(window);
      window.fetch = function(input, init){
        if (typeof input === 'string' && /^\/(api|telegram)(\/|$)/.test(input)) input = window.APP_BASE_PATH + input;
        return nativeFetch(input, init);
      };
    })();
  </script>
  <style>
    :root{--red:#df0f1b;--black:#101012;--ink:#18181b;--muted:#74747b;--line:#e7e7eb;--soft:#f7f7f8;--softRed:#fff1f2;--card:#fff;--r:3px;--shadow:0 7px 18px rgba(16,16,18,.07)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.wrap{max-width:1180px;margin:0 auto;padding:6px 6px 78px}.top,.panel,.item,.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px}.brand{display:flex;align-items:center;gap:8px}.logo{width:34px;height:34px;border-radius:var(--r);display:grid;place-items:center;border:1px solid var(--black);color:var(--red);background:#fff}.logo svg{width:21px;height:21px}.top h1{font-size:14px;margin:0;letter-spacing:-.3px}.top p{font-size:10.4px;margin:2px 0 0;color:var(--muted);line-height:1.25}.btn,.ghost,.black{border-radius:var(--r);padding:6px 8px;min-height:30px;font-size:11px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}.btn{background:var(--red);color:#fff}.black{background:var(--black);color:#fff}.ghost{background:#fff;color:var(--black);border:1px solid var(--line)}.mini{min-height:27px;padding:5px 7px;font-size:10.5px}.panel{padding:8px;margin:7px 0}.login{max-width:430px;margin:18px auto}.panel h2{font-size:14px;margin:0 0 5px}.field{display:flex;flex-direction:column;gap:4px;margin:6px 0}.field label{font-size:10px;font-weight:950;color:#4a4a50}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:6px;outline:0;font-size:11px;min-height:30px}.field textarea{min-height:58px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 2px rgba(223,15,27,.09)}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:7px 0}.stat{padding:7px}.stat b{font-size:15px;display:block}.stat small{font-size:9.5px;color:var(--muted);font-weight:900}.tabs{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);display:flex;gap:5px;overflow:auto;padding:6px 0;margin:6px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px 8px;font-size:10.7px;font-weight:950;white-space:nowrap}.tab.active{background:var(--black);border-color:var(--black);color:#fff}.section{display:none}.section.active{display:block}.table{display:grid;gap:7px}.item{padding:7px}.itemTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.itemTop b{font-size:11.5px}.muted{color:var(--muted);font-size:10.5px;line-height:1.35}.pill,.status{border-radius:var(--r);padding:4px 6px;font-size:9.8px;font-weight:950;white-space:nowrap}.pill{background:var(--black);color:#fff}.status{border:1px solid #ffd4d7;background:var(--softRed);color:#850d15}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chip{background:var(--soft);border:1px solid var(--line);border-radius:var(--r);padding:3px 5px;font-size:9.5px;color:var(--muted);font-weight:850}.proofs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.proofs img{width:62px;height:62px;border-radius:var(--r);object-fit:cover;border:1px solid var(--line)}.tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--black);color:#fff;padding:9px 11px;border-radius:var(--r);display:none;z-index:50;max-width:88%;font-size:11px}.toast.show{display:block}.notice{border:1px solid #ffd4d7;background:var(--softRed);color:#761018;border-radius:var(--r);padding:7px;font-size:10.5px;line-height:1.35;margin:7px 0}.icon{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}@media(max-width:780px){.wrap{padding:5px 5px 78px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.row,.grid2{grid-template-columns:1fr}.itemTop{flex-direction:column}.tabs{gap:4px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><div class="logo"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4.5-2.8 7.6-7 9-4.2-1.4-7-4.5-7-9V7l7-4z"/><path d="M9 12l2 2 4-5"/></svg></div><div><h1>Garant Market Admin</h1><p>So‘rovlar, xizmatlar, referral va garant jarayonlari</p></div></div>
      <div class="tools"><button class="ghost mini" onclick="goMiniApp()">Mini app</button><button class="black mini" onclick="clearSession()">Sessiyani tozalash</button></div>
    </header>

    <section id="loginPanel" class="panel login">
      <h2>Admin kirish</h2>
      <p class="muted">Parolni kiriting. Telegram admin ID sozlangan bo‘lsa, mini app ichidan ham kirish mumkin.</p>
      <div class="field"><label>Admin parol</label><input id="password" type="password" placeholder="admin parol" autocomplete="current-password" /></div>
      <button class="btn" onclick="login()">Kirish</button>
      <div class="notice" id="loginHint">Kirish bo‘lmasa: avval “Sessiyani tozalash” bosing, keyin qayta urinib ko‘ring.</div>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="stats" id="stats"></div>
      <div class="tabs">
        <button class="tab active" data-tab="requests" onclick="showTab('requests')">So‘rovlar</button>
        <button class="tab" data-tab="services" onclick="showTab('services')">Xizmatlar</button>
        <button class="tab" data-tab="newService" onclick="showTab('newService')">Qo‘shish</button>
        <button class="tab" onclick="logout()">Chiqish</button>
      </div>

      <section id="requests" class="section active">
        <div class="panel"><div class="row"><div class="field"><label>Status</label><select id="statusFilter" onchange="loadRequests()"><option value="">Hammasi</option><option value="NEW">Yangi</option><option value="REVIEWING">Ko‘rib chiqilmoqda</option><option value="WAITING_PAYMENT">To‘lov kutilmoqda</option><option value="IN_GUARANT">Garant jarayoni</option><option value="DONE">Yakunlandi</option><option value="CANCELLED">Bekor qilindi</option></select></div><div class="field"><label>Platforma</label><select id="platformFilter" onchange="loadRequests()"><option value="">Hammasi</option><option>youtube</option><option>instagram</option><option>tiktok</option><option>telegram</option><option>pubg</option><option>ads</option><option>other</option></select></div></div></div>
        <div id="requestsList" class="table"></div>
      </section>

      <section id="services" class="section"><div id="servicesList" class="table"></div></section>

      <section id="newService" class="section">
        <div class="panel"><h2>Yangi xizmat qo‘shish</h2><form id="serviceForm" onsubmit="saveService(event)">
          <div class="row"><div class="field"><label>Nomi</label><input name="title" required placeholder="Masalan: YouTube kanal savdosi" /></div><div class="field"><label>Badge</label><input name="badge" placeholder="Talabgir" /></div></div>
          <div class="row"><div class="field"><label>Kategoriya</label><select name="category"><option value="accounts">accounts</option><option value="guarantee">guarantee</option><option value="promotion">promotion</option><option value="gaming">gaming</option><option value="support">support</option><option value="other">other</option></select></div><div class="field"><label>Platforma</label><input name="platform" placeholder="youtube / instagram / all" /></div></div>
          <div class="row"><div class="field"><label>Boshlang‘ich narx</label><input name="priceFrom" type="number" value="0" /></div><div class="field"><label>Sort</label><input name="sort" type="number" value="100" /></div></div>
          <div class="field"><label>Tavsif</label><textarea name="description" placeholder="Xizmat haqida qisqa matn"></textarea></div>
          <div class="field"><label>Kerakli inputlar — har qatorda bittadan</label><textarea name="requiredFields" placeholder="Kanal havolasi&#10;Obunachi soni&#10;Narx"></textarea></div>
          <button class="btn">Saqlash</button>
        </form></div>
      </section>
    </section>
  </main>
  <div id="toast" class="toast"></div>

<script>
  const tg = window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
  const API = `${location.origin}${window.APP_BASE_PATH || ''}/api/`;
  let token = localStorage.getItem('socialAdminToken') || '';
  const $ = id => document.getElementById(id);
  const esc = s => String(s??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  const money=(v,c='UZS')=>Number(v||0).toLocaleString('uz-UZ')+' '+c;
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
  function goMiniApp(){ location.href = `${window.APP_BASE_PATH || ''}/`; }
  function clearSession(){ localStorage.removeItem('socialAdminToken'); token=''; toast('Sessiya tozalandi'); $('loginPanel').classList.remove('hidden'); $('adminPanel').classList.add('hidden'); }
  async function api(path,opt={}){ opt.headers={...(opt.headers||{}), ...(token?{Authorization:'Bearer '+token}:{})}; if(opt.body && !(opt.body instanceof FormData)){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(opt.body); } const r=await fetch(API+path.replace(/^\//,''),opt); const j=await r.json().catch(()=>({success:false,message:'Server javobi noto‘g‘ri'})); if(!r.ok||j.success===false) throw new Error(j.message||'Xatolik'); return j; }
  async function login(){ try{ const body={password:$('password').value}; if(tg?.initData) body.initData=tg.initData; const old=token; token=''; const j=await api('admin/login',{method:'POST',body}); token=j.token || old; localStorage.setItem('socialAdminToken',token); showAdmin(); toast('Admin panel ochildi'); }catch(e){ token=localStorage.getItem('socialAdminToken')||''; toast(e.message); } }
  function logout(){ clearSession(); }
  function showAdmin(){ $('loginPanel').classList.add('hidden'); $('adminPanel').classList.remove('hidden'); loadAll(); }
  function showTab(id){ document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id)); document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id)); if(id==='requests')loadRequests(); if(id==='services')loadServices(); }
  async function loadStats(){ const j=await api('admin/stats'); const s=j.stats; $('stats').innerHTML=`<div class="stat"><b>${s.total}</b><small>Jami</small></div><div class="stat"><b>${s.fresh}</b><small>Yangi</small></div><div class="stat"><b>${s.inGarant}</b><small>Garant</small></div><div class="stat"><b>${s.done}</b><small>Yakun</small></div><div class="stat"><b>${s.services}</b><small>Xizmat</small></div>`; }
  async function loadRequests(){ try{ const q=new URLSearchParams(); if($('statusFilter')?.value)q.set('status',$('statusFilter').value); if($('platformFilter')?.value)q.set('platform',$('platformFilter').value); const j=await api('admin/requests?'+q.toString()); $('requestsList').innerHTML=(j.requests||[]).map(renderRequest).join('')||'<div class="panel muted">So‘rov yo‘q</div>'; }catch(e){ toast(e.message); if(String(e.message).includes('sessiya')) clearSession(); } }
  function typeText(t){return {SELL_ACCOUNT:'Sotish',BUY_ACCOUNT:'Sotib olish',GUARANT_DEAL:'Garant',SERVICE_ORDER:'Xizmat'}[t]||t;}
  function statusOptions(current){ const items=[['NEW','Yangi'],['REVIEWING','Ko‘rib chiqilmoqda'],['WAITING_PAYMENT','To‘lov kutilmoqda'],['IN_GUARANT','Garant jarayoni'],['DONE','Yakunlandi'],['CANCELLED','Bekor qilindi']]; return items.map(([v,t])=>`<option value="${v}" ${v===current?'selected':''}>${t}</option>`).join(''); }
  function renderRequest(r){ return `<article class="item"><div class="itemTop"><div><b>#${esc(r.requestNo)} · ${esc(typeText(r.requestType))}</b><p class="muted">${esc(r.serviceTitle||r.platform)} · ${esc(r.accountUsername||r.accountLink||'hisob ko‘rsatilmagan')}</p></div><span class="status">${esc(r.status)}</span></div><div class="grid2"><div><p class="muted"><b>Platforma:</b> ${esc(r.platform)}<br><b>Auditoriya:</b> ${esc(r.audienceSize)}<br><b>Narx:</b> ${money(r.price,r.currency)}<br><b>Holat:</b> ${esc(r.monetization)}<br><b>Nisha:</b> ${esc(r.niche||r.country||'')}</p><p class="muted"><b>Izoh:</b> ${esc(r.note||'')}</p></div><div><p class="muted"><b>Aloqa:</b> ${esc(r.contactName||r.sellerName||r.buyerName||'')} ${esc(r.contactTelegram||r.sellerTelegram||r.buyerTelegram||'')} ${esc(r.contactPhone||r.sellerPhone||r.buyerPhone||'')}<br><b>Telegram:</b> ${r.telegramUsername?'@'+esc(r.telegramUsername):esc(r.telegramFullName)}<br><b>Referral:</b> ${esc(r.referralCode||r.referredBy||'-')}</p><div class="proofs">${(r.proofImages||[]).map(i=>`<a href="${esc(i.url)}" target="_blank"><img src="${esc(i.url)}" /></a>`).join('')}</div></div></div><div class="row"><div class="field"><label>Status o‘zgartirish</label><select id="st_${r._id}">${statusOptions(r.status)}</select></div><div class="field"><label>Admin izoh</label><input id="note_${r._id}" value="${esc(r.adminNote||'')}" placeholder="Ichki izoh" /></div></div><button class="btn mini" onclick="updateRequest('${r._id}')">Saqlash</button></article>`; }
  async function updateRequest(id){ try{ await api('admin/requests/'+id,{method:'PATCH',body:{status:$('st_'+id).value,adminNote:$('note_'+id).value}}); toast('So‘rov yangilandi'); loadStats(); loadRequests(); }catch(e){ toast(e.message); } }
  async function loadServices(){ try{ const j=await api('admin/services'); $('servicesList').innerHTML=(j.services||[]).map(s=>`<article class="item"><div class="itemTop"><div><b>${esc(s.title)}</b><p class="muted">${esc(s.description)}</p></div><span class="pill">${esc(s.platform)} · ${esc(s.category)}</span></div><div class="chips">${(s.requiredFields||[]).map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div><div class="row"><div class="field"><label>Badge</label><input id="badge_${s._id}" value="${esc(s.badge||'')}"></div><div class="field"><label>Sort</label><input id="sort_${s._id}" type="number" value="${esc(s.sort||100)}"></div></div><div class="row"><div class="field"><label>Platforma</label><input id="platform_${s._id}" value="${esc(s.platform||'other')}"></div><div class="field"><label>Aktiv</label><select id="active_${s._id}"><option value="true" ${s.active?'selected':''}>Ha</option><option value="false" ${!s.active?'selected':''}>Yo‘q</option></select></div></div><div class="tools"><button class="btn mini" onclick="quickSaveService('${s._id}')">Yangilash</button><button class="ghost mini" onclick="deleteService('${s._id}')">O‘chirish</button></div></article>`).join('')||'<div class="panel muted">Xizmat yo‘q</div>'; }catch(e){ toast(e.message); } }
  async function quickSaveService(id){ try{ await api('admin/services/'+id,{method:'PATCH',body:{badge:$('badge_'+id).value,sort:$('sort_'+id).value,platform:$('platform_'+id).value,active:$('active_'+id).value}}); toast('Xizmat yangilandi'); loadServices(); }catch(e){ toast(e.message); } }
  async function deleteService(id){ if(!confirm('Xizmat o‘chirilsinmi?'))return; try{ await api('admin/services/'+id,{method:'DELETE'}); toast('O‘chirildi'); loadServices(); loadStats(); }catch(e){ toast(e.message); } }
  async function saveService(e){ e.preventDefault(); const fd=new FormData(e.target); const body=Object.fromEntries(fd.entries()); body.requiredFields=String(body.requiredFields||'').split('\n').map(x=>x.trim()).filter(Boolean); try{ await api('admin/services',{method:'POST',body}); toast('Yangi xizmat qo‘shildi'); e.target.reset(); showTab('services'); loadStats(); }catch(err){ toast(err.message); } }
  async function loadAll(){ try{ await Promise.all([loadStats(),loadRequests(),loadServices()]); }catch(e){ toast(e.message); if(String(e.message).includes('sessiya') || String(e.message).includes('401')) clearSession(); } }
  $('password').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
  if(token) showAdmin();
</script>
</body>
</html>
