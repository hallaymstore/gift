<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Garant Market Admin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function(){
      const firstPath = location.pathname.split('/').filter(Boolean)[0] || '';
      window.APP_BASE_PATH = firstPath ? '/' + firstPath : '';
      const nativeFetch = window.fetch.bind(window);
      window.fetch = function(input, init){
        if (typeof input === 'string' && /^\/(api|telegram)(\/|$)/.test(input)) input = window.APP_BASE_PATH + input;
        return nativeFetch(input, init);
      };
    })();
  </script>
  <style>
    :root{--red:#df0f1b;--black:#101012;--ink:#18181b;--muted:#74747b;--line:#e7e7eb;--soft:#f7f7f8;--softRed:#fff1f2;--r:3px;--shadow:0 7px 18px rgba(16,16,18,.07)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:11px}button,input,select,textarea{font:inherit;color:inherit}button{border:0;cursor:pointer}.wrap{max-width:980px;margin:0 auto;padding:7px 7px 70px}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;margin:7px 0}.top{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);z-index:10;border-bottom:1px solid var(--line);padding:7px}.top h1{font-size:15px;margin:0}.muted{color:var(--muted);font-size:10.5px;line-height:1.35}.btn,.black,.ghost{border-radius:var(--r);padding:6px 8px;min-height:30px;font-size:11px;font-weight:950;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn{background:var(--red);color:#fff}.black{background:var(--black);color:#fff}.ghost{border:1px solid var(--line);background:#fff;color:#111}.mini{min-height:26px;font-size:10px;padding:5px 7px}.tabs{display:flex;gap:5px;overflow:auto;padding:7px 0 2px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:6px 8px;font-weight:950;font-size:10.5px}.tab.active{background:var(--black);color:#fff;border-color:var(--black)}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:7px}.stat b{display:block;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.field{display:flex;flex-direction:column;gap:4px;margin:6px 0}.field label{font-size:10px;font-weight:950;color:#4a4a50}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:6px;outline:0;font-size:11px;min-height:30px}.field textarea{min-height:60px;resize:vertical}.tools{display:flex;gap:5px;flex-wrap:wrap}.pill,.status{border:1px solid #ffd4d7;background:var(--softRed);color:#850d15;border-radius:var(--r);padding:3px 5px;font-size:9.8px;font-weight:950}.ok{background:#ecfdf3;border-color:#bbf7d0;color:#166534}.dark{background:#111;color:#fff;border-color:#111}.itemTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.itemTop b{font-size:12px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--soft);border-radius:var(--r);padding:3px 5px;font-size:9.4px;font-weight:800;color:#555}.proofs{display:flex;gap:5px;flex-wrap:wrap}.proofs img{width:48px;height:48px;object-fit:cover;border:1px solid var(--line);border-radius:var(--r)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--black);color:#fff;padding:9px 11px;border-radius:var(--r);box-shadow:0 12px 30px rgba(0,0,0,.22);display:none;z-index:70;max-width:88%;font-size:11px;line-height:1.35}.toast.show{display:block}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.row,.row3{grid-template-columns:1fr}.wrap{padding-bottom:90px}}
  </style>
</head>
<body>
  <div class="top"><h1>Garant Market Admin</h1><div class="muted">Telegram ID orqali mini app ichida kirish yoki parol bilan browserdan kirish.</div></div>
  <main class="wrap">
    <section id="loginPanel" class="panel">
      <h2 style="font-size:14px;margin:0 0 6px">Admin kirish</h2>
      <p class="muted">Telegram admin profilidan ochilganda avtomatik kiradi. Browserda ochsangiz parol kiriting.</p>
      <div class="field"><label>Admin parol</label><input id="password" type="password" placeholder="Admin parol" /></div>
      <div class="tools"><button class="btn" onclick="login()">Kirish</button><button class="ghost" onclick="clearSession()">Sessiyani tozalash</button><button class="black" onclick="goMiniApp()">Mini app</button></div>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="tabs">
        <button class="tab active" data-tab="dashboard" onclick="showTab('dashboard')">Statistika</button>
        <button class="tab" data-tab="requests" onclick="showTab('requests')">So‘rovlar</button>
        <button class="tab" data-tab="marketplace" onclick="showTab('marketplace')">Marketplace</button>
        <button class="tab" data-tab="services" onclick="showTab('services')">Xizmatlar</button>
        <button class="tab" data-tab="users" onclick="showTab('users')">Userlar</button>
        <button class="tab" data-tab="settings" onclick="showTab('settings')">Referral</button>
        <button class="tab" onclick="logout()">Chiqish</button>
      </div>

      <section id="dashboard" class="section active"><div id="stats" class="grid"></div></section>

      <section id="requests" class="section">
        <div class="panel"><div class="row"><div class="field"><label>Status</label><select id="statusFilter" onchange="loadRequests()"><option value="">Hammasi</option><option value="NEW">Yangi</option><option value="REVIEWING">Ko‘rib chiqilmoqda</option><option value="WAITING_PAYMENT">To‘lov kutilmoqda</option><option value="IN_GUARANT">Garant</option><option value="DONE">Yakunlandi</option><option value="CANCELLED">Bekor qilindi</option></select></div><div class="field"><label>Platforma</label><input id="platformFilter" oninput="loadRequests()" placeholder="youtube / telegram"></div></div></div>
        <div id="requestsList"></div>
      </section>

      <section id="marketplace" class="section">
        <div class="panel"><h2 style="font-size:14px;margin:0 0 6px">Marketplace eʼlon qo‘shish</h2><form id="marketForm" onsubmit="saveMarket(event)">
          <div class="row"><div class="field"><label>Nomi</label><input name="title" required placeholder="Masalan: YouTube kanal 10k"></div><div class="field"><label>Platforma</label><input name="platform" placeholder="youtube / telegram / pubg"></div></div>
          <div class="row3"><div class="field"><label>Narx</label><input name="price" type="number" value="0"></div><div class="field"><label>Eski narx</label><input name="oldPrice" type="number" value="0"></div><div class="field"><label>Status</label><select name="status"><option value="AVAILABLE">Sotuvda</option><option value="RESERVED">Band</option><option value="SOLD">Sotildi</option><option value="HIDDEN">Yashirin</option></select></div></div>
          <div class="row"><div class="field"><label>Username/link</label><input name="accountUsername" placeholder="@username"><input name="accountLink" placeholder="https://..."></div><div class="field"><label>Auditoriya / holat</label><input name="audienceSize" placeholder="10k obunachi"><input name="monetization" placeholder="Monetizatsiya bor/yo‘q"></div></div>
          <div class="row"><div class="field"><label>Nisha / davlat</label><input name="niche" placeholder="Gaming"><input name="country" placeholder="UZ / USA"></div><div class="field"><label>Badge / sort</label><input name="badge" placeholder="Tasdiqlangan"><input name="sort" type="number" value="100"></div></div>
          <div class="field"><label>Tavsif</label><textarea name="description" placeholder="Eʼlon haqida maʼlumot"></textarea></div>
          <div class="field"><label>Rasm URLlari — har qatorda bittadan</label><textarea name="imageUrls" placeholder="https://..."></textarea></div>
          <button class="btn">Eʼlon qo‘shish</button>
        </form></div>
        <div id="marketList"></div>
      </section>

      <section id="services" class="section">
        <div class="panel"><h2 style="font-size:14px;margin:0 0 6px">Xizmat qo‘shish</h2><form id="serviceForm" onsubmit="saveService(event)">
          <div class="row"><div class="field"><label>Nomi</label><input name="title" required placeholder="Telegram Premium arzon"></div><div class="field"><label>Badge</label><input name="badge" placeholder="Arzon"></div></div>
          <div class="row3"><div class="field"><label>Kategoriya</label><select name="category"><option value="accounts">accounts</option><option value="guarantee">guarantee</option><option value="promotion">promotion</option><option value="gaming">gaming</option><option value="support">support</option><option value="other">other</option></select></div><div class="field"><label>Platforma</label><input name="platform" placeholder="telegram / pubg / all"></div><div class="field"><label>Sort</label><input name="sort" type="number" value="100"></div></div>
          <div class="field"><label>Tavsif</label><textarea name="description" placeholder="Xizmat haqida"></textarea></div>
          <div class="field"><label>Managed inputs — har qatorda: Label | type | required | placeholder | option1,option2</label><textarea name="customFields" placeholder="Telegram username | text | required | @username&#10;Miqdor | select | required | Tanlang | 100 Stars,250 Stars,500 Stars&#10;PUBG ID | number | required | 123456"></textarea></div>
          <button class="btn">Xizmat qo‘shish</button>
        </form></div>
        <div id="servicesList"></div>
      </section>

      <section id="users" class="section"><div id="usersList"></div></section>

      <section id="settings" class="section">
        <div class="panel"><h2 style="font-size:14px;margin:0 0 6px">Referral va umumiy sozlamalar</h2><form id="settingsForm" onsubmit="saveSettings(event)">
          <div class="row"><div class="field"><label>Referral bonus</label><input name="referralBonus" type="number" value="0"></div><div class="field"><label>Marketplace title</label><input name="marketplaceTitle" value="Marketplace"></div></div>
          <div class="field"><label>Referral matni</label><textarea name="referralBonusText"></textarea></div>
          <div class="field"><label>Savdo guruhi/chat URL</label><input name="tradeChatUrl" placeholder="https://t.me/..."></div>
          <button class="btn">Saqlash</button>
        </form></div>
      </section>
    </section>
  </main>
  <div id="toast" class="toast"></div>

<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const API=`${location.origin}${window.APP_BASE_PATH||''}/api/`;
let token=localStorage.getItem('socialAdminToken')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const money=(v,c='UZS')=>Number(v||0).toLocaleString('uz-UZ')+' '+(c||'UZS');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}; if(opt.body&&!(opt.body instanceof FormData)){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)} const r=await fetch(API+path.replace(/^\//,''),opt); const j=await r.json().catch(()=>({success:false,message:'Server javobi noto‘g‘ri'})); if(!r.ok||j.success===false)throw new Error(j.message||'Xatolik'); return j;}
function goMiniApp(){location.href=`${window.APP_BASE_PATH||''}/`}
function clearSession(){localStorage.removeItem('socialAdminToken');token='';$('loginPanel').classList.remove('hidden');$('adminPanel').classList.add('hidden');toast('Sessiya tozalandi')}
async function login(){try{const body={password:$('password').value}; if(tg?.initData)body.initData=tg.initData; const old=token; token=''; const j=await api('admin/login',{method:'POST',body}); token=j.token||old; localStorage.setItem('socialAdminToken',token); showAdmin(); toast('Admin panel ochildi')}catch(e){token=localStorage.getItem('socialAdminToken')||'';toast(e.message)}}
function logout(){clearSession()}
function showAdmin(){$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');loadAll()}
function showTab(id){document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id===id));document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id)); if(id==='dashboard')loadStats(); if(id==='requests')loadRequests(); if(id==='marketplace')loadMarket(); if(id==='services')loadServices(); if(id==='users')loadUsers(); if(id==='settings')loadSettings();}
async function loadStats(){const j=await api('admin/stats');const s=j.stats;$('stats').innerHTML=Object.entries({Jami:s.total,Yangi:s.fresh,Garant:s.inGarant,Yakun:s.done,Xizmat:s.services,User:s.users,Market:s.marketplace,Sotildi:s.sold,Referral:s.referrals}).map(([k,v])=>`<div class="stat"><b>${v??0}</b><small>${k}</small></div>`).join('')}
async function loadRequests(){try{const q=new URLSearchParams(); if($('statusFilter')?.value)q.set('status',$('statusFilter').value); if($('platformFilter')?.value)q.set('platform',$('platformFilter').value); const j=await api('admin/requests?'+q.toString());$('requestsList').innerHTML=(j.requests||[]).map(renderRequest).join('')||'<div class="panel muted">So‘rov yo‘q</div>'}catch(e){toast(e.message);if(String(e.message).includes('sessiya'))clearSession()}}
function statusOptions(cur){return [['NEW','Yangi'],['REVIEWING','Ko‘rib chiqilmoqda'],['WAITING_PAYMENT','To‘lov kutilmoqda'],['IN_GUARANT','Garant jarayoni'],['DONE','Yakunlandi'],['CANCELLED','Bekor qilindi']].map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('')}
function renderRequest(r){const dyn=r.extra?.dynamicFields||{};return `<article class="item"><div class="itemTop"><div><b>#${esc(r.requestNo)} · ${esc(r.serviceTitle||r.platform)}</b><p class="muted">${esc(r.requestType)} · ${esc(r.accountUsername||r.accountLink||'')}</p></div><span class="status">${esc(r.status)}</span></div><div class="row"><div><p class="muted"><b>Platforma:</b> ${esc(r.platform)}<br><b>Auditoriya:</b> ${esc(r.audienceSize)}<br><b>Narx:</b> ${money(r.price,r.currency)}<br><b>Holat:</b> ${esc(r.monetization)}<br><b>Dynamic:</b> ${esc(Object.entries(dyn).map(([k,v])=>k+': '+v).join(' | '))}</p><p class="muted"><b>Izoh:</b> ${esc(r.note||'')}</p></div><div><p class="muted"><b>Aloqa:</b> ${esc(r.contactName||r.sellerName||r.buyerName||'')} ${esc(r.contactTelegram||r.sellerTelegram||r.buyerTelegram||'')} ${esc(r.contactPhone||r.sellerPhone||r.buyerPhone||'')}<br><b>Telegram:</b> ${r.telegramUsername?'@'+esc(r.telegramUsername):esc(r.telegramFullName)}<br><b>Referral:</b> ${esc(r.referralCode||r.referredBy||'-')}</p><div class="proofs">${(r.proofImages||[]).map(i=>`<a href="${esc(i.url)}" target="_blank"><img src="${esc(i.url)}"></a>`).join('')}</div></div></div><div class="row"><div class="field"><label>Status</label><select id="st_${r._id}">${statusOptions(r.status)}</select></div><div class="field"><label>Admin izoh</label><input id="note_${r._id}" value="${esc(r.adminNote||'')}"></div></div><div class="tools"><button class="btn mini" onclick="updateRequest('${r._id}')">Saqlash</button><button class="black mini" onclick="publishRequest('${r._id}')">Marketplacega chiqarish</button></div></article>`}
async function updateRequest(id){try{await api('admin/requests/'+id,{method:'PATCH',body:{status:$('st_'+id).value,adminNote:$('note_'+id).value}});toast('So‘rov yangilandi');loadStats();loadRequests()}catch(e){toast(e.message)}}
async function publishRequest(id){if(!confirm('So‘rov marketplacega eʼlon qilinsinmi?'))return;try{await api('admin/requests/'+id+'/publish-marketplace',{method:'POST',body:{}});toast('Marketplacega chiqarildi');loadStats();loadMarket()}catch(e){toast(e.message)}}
async function loadMarket(){try{const j=await api('admin/marketplace');$('marketList').innerHTML=(j.items||[]).map(renderMarket).join('')||'<div class="panel muted">Eʼlon yo‘q</div>'}catch(e){toast(e.message)}}
function marketStatusOptions(cur){return [['AVAILABLE','Sotuvda'],['RESERVED','Band'],['SOLD','Sotildi'],['HIDDEN','Yashirin']].map(([v,t])=>`<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('')}
function renderMarket(x){return `<article class="item"><div class="itemTop"><div><b>${esc(x.title)}</b><p class="muted">${esc(x.platform)} · ${money(x.price,x.currency)} · ${esc(x.audienceSize||'')}</p></div><span class="status ${x.status==='SOLD'?'dark':''}">${esc(x.status)}</span></div><p class="muted">${esc(x.description||'')}</p><div class="proofs">${(x.images||[]).map(i=>`<a href="${esc(i.url)}" target="_blank"><img src="${esc(i.url)}"></a>`).join('')}</div><div class="row3"><div class="field"><label>Status</label><select id="mst_${x._id}">${marketStatusOptions(x.status)}</select></div><div class="field"><label>Narx</label><input id="mpr_${x._id}" type="number" value="${esc(x.price||0)}"></div><div class="field"><label>Sort</label><input id="mso_${x._id}" type="number" value="${esc(x.sort||100)}"></div></div><div class="tools"><button class="btn mini" onclick="updateMarket('${x._id}')">Yangilash</button><button class="black mini" onclick="markSold('${x._id}')">Sotildi</button><button class="ghost mini" onclick="deleteMarket('${x._id}')">O‘chirish</button></div></article>`}
async function saveMarket(e){e.preventDefault();const fd=new FormData(e.target);try{await api('admin/marketplace',{method:'POST',body:fd});toast('Eʼlon qo‘shildi');e.target.reset();loadMarket();loadStats()}catch(err){toast(err.message)}}
async function updateMarket(id){try{await api('admin/marketplace/'+id,{method:'PATCH',body:{status:$('mst_'+id).value,price:$('mpr_'+id).value,sort:$('mso_'+id).value}});toast('Eʼlon yangilandi');loadMarket();loadStats()}catch(e){toast(e.message)}}
async function markSold(id){try{await api('admin/marketplace/'+id,{method:'PATCH',body:{status:'SOLD'}});toast('Sotildi deb belgilandi');loadMarket();loadStats()}catch(e){toast(e.message)}}
async function deleteMarket(id){if(!confirm('Eʼlon o‘chirilsinmi?'))return;try{await api('admin/marketplace/'+id,{method:'DELETE'});toast('O‘chirildi');loadMarket();loadStats()}catch(e){toast(e.message)}}
async function loadServices(){try{const j=await api('admin/services');$('servicesList').innerHTML=(j.services||[]).map(renderService).join('')||'<div class="panel muted">Xizmat yo‘q</div>'}catch(e){toast(e.message)}}
function renderService(s){const fields=(s.customFields&&s.customFields.length?s.customFields:(s.requiredFields||[]).map(x=>({label:x,type:'text',required:true})));return `<article class="item"><div class="itemTop"><div><b>${esc(s.title)}</b><p class="muted">${esc(s.description)}</p></div><span class="pill">${esc(s.platform)} · ${esc(s.category)}</span></div><div class="chips">${fields.map(f=>`<span class="chip">${esc(f.label)} · ${esc(f.type||'text')}</span>`).join('')}</div><div class="row3"><div class="field"><label>Badge</label><input id="badge_${s._id}" value="${esc(s.badge||'')}"></div><div class="field"><label>Sort</label><input id="sort_${s._id}" type="number" value="${esc(s.sort||100)}"></div><div class="field"><label>Aktiv</label><select id="active_${s._id}"><option value="true" ${s.active?'selected':''}>Ha</option><option value="false" ${!s.active?'selected':''}>Yo‘q</option></select></div></div><div class="tools"><button class="btn mini" onclick="quickSaveService('${s._id}')">Yangilash</button><button class="ghost mini" onclick="deleteService('${s._id}')">O‘chirish</button></div></article>`}
async function quickSaveService(id){try{await api('admin/services/'+id,{method:'PATCH',body:{badge:$('badge_'+id).value,sort:$('sort_'+id).value,active:$('active_'+id).value}});toast('Xizmat yangilandi');loadServices()}catch(e){toast(e.message)}}
async function deleteService(id){if(!confirm('Xizmat o‘chirilsinmi?'))return;try{await api('admin/services/'+id,{method:'DELETE'});toast('O‘chirildi');loadServices();loadStats()}catch(e){toast(e.message)}}
async function saveService(e){e.preventDefault();const fd=new FormData(e.target);const body=Object.fromEntries(fd.entries());body.requiredFields=String(body.customFields||'').split('\n').map(x=>x.split('|')[0].trim()).filter(Boolean);try{await api('admin/services',{method:'POST',body});toast('Xizmat qo‘shildi');e.target.reset();loadServices();loadStats()}catch(err){toast(err.message)}}
async function loadUsers(){try{const j=await api('admin/users');$('usersList').innerHTML=(j.users||[]).map(u=>`<article class="item"><div class="itemTop"><div><b>${esc(u.fullName||u.username||u.telegramUserId)}</b><p class="muted">ID: ${esc(u.telegramUserId)} · @${esc(u.username||'-')}<br>Visit: ${esc(u.visits||0)} · Referral: ${esc(u.referralCode||'-')} · Taklif: ${esc(u.referredBy||'-')}</p></div><span class="pill">${new Date(u.lastSeen||u.updatedAt||Date.now()).toLocaleString('uz-UZ')}</span></div></article>`).join('')||'<div class="panel muted">User yo‘q</div>'}catch(e){toast(e.message)}}
async function loadSettings(){try{const j=await api('admin/settings');const s=j.settings||{};const f=$('settingsForm');f.referralBonus.value=s.referralBonus||0;f.referralBonusText.value=s.referralBonusText||'';f.tradeChatUrl.value=s.tradeChatUrl||'';f.marketplaceTitle.value=s.marketplaceTitle||'Marketplace'}catch(e){toast(e.message)}}
async function saveSettings(e){e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());try{await api('admin/settings',{method:'PATCH',body});toast('Sozlamalar saqlandi')}catch(err){toast(err.message)}}
async function loadAll(){try{await Promise.all([loadStats(),loadRequests(),loadMarket(),loadServices(),loadSettings()])}catch(e){toast(e.message); if(String(e.message).includes('sessiya')||String(e.message).includes('401'))clearSession()}}
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if(token)showAdmin(); else if(tg?.initData)login();
</script>
</body>
</html>
